<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1e1e1f; --side:#262627; --panel:#313233; --line:#48494a; --text:#f2f2f2; --dim:#a0a1a2;
  --green:#3c8527; --green-hi:#52a535; --green-lo:#2a5d1b; --dirt:#5b3d27;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.pix{font-family:Silkscreen,"Courier New",monospace;letter-spacing:.5px}
/* title bar */
.top{height:56px;background:var(--side);border-bottom:2px solid #111;display:flex;align-items:center;padding:0 16px;gap:24px;flex:none}
.logo{display:flex;align-items:center;gap:10px;font-size:18px}
.cube{width:26px;height:26px;background:
  linear-gradient(135deg,#7bc34f 0 40%,#5aa13a 40% 60%,#7bc34f 60%);
  border:2px solid #1a3b10;image-rendering:pixelated}
.tabs{display:flex;gap:4px;height:100%}
.tab{background:none;border:0;color:var(--dim);padding:0 16px;font:inherit;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;height:100%}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--green-hi)}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.head{width:30px;height:30px;background:#c89b6d;border:2px solid #111;position:relative;image-rendering:pixelated}
.head::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#3b2a1a}
.head::after{content:"";position:absolute;left:5px;top:13px;width:4px;height:4px;background:#222;box-shadow:12px 0 #222}
/* body */
.main{flex:1;display:flex;min-height:0}
.side{width:230px;background:var(--side);border-right:2px solid #111;overflow:auto;flex:none;padding:10px 0}
.side h3{font-size:11px;color:var(--dim);padding:10px 18px 6px;font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:8px 18px;cursor:pointer;border-left:4px solid transparent}
.item:hover{background:#2f2f30}
.item.on{background:#38393a;border-left-color:var(--green-hi)}
.icon{width:36px;height:36px;flex:none;border:2px solid #111;display:grid;place-items:center;font-size:16px;image-rendering:pixelated}
.item b{display:block;font-weight:600}
.item small{color:var(--dim);font-size:12px}
.hero{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;overflow:auto}
.sky{position:absolute;inset:0 0 auto 0;height:100%;background:
  linear-gradient(180deg,rgba(30,30,31,.15) 0%,rgba(30,30,31,.55) 55%,var(--bg) 100%),
  var(--art,linear-gradient(180deg,#6fa8dc,#a9d1f0 55%,#7bc34f 55% 60%,#5b3d27 60%));
  transition:background .3s}
.hero-in{position:relative;margin-top:auto;padding:0 40px 28px}
.hero-in h1{font-size:44px;line-height:1.05;text-shadow:3px 3px 0 #000}
.hero-in p{max-width:560px;color:#e3e3e3;margin-top:10px;text-shadow:1px 1px 0 #000}
.tags{display:flex;gap:6px;margin-top:12px}
.tag{background:rgba(0,0,0,.5);border:1px solid var(--line);padding:2px 8px;font-size:12px}
/* news strip */
.news{position:relative;display:flex;gap:12px;padding:0 40px 20px;overflow-x:auto}
.card{flex:none;width:200px;background:var(--panel);border:2px solid #111;cursor:pointer}
.card:hover{border-color:var(--green-hi)}
.card .th{height:84px;display:grid;place-items:center;font-size:30px}
.card div+div{padding:8px 10px;font-weight:600;font-size:13px}
.card small{display:block;color:var(--dim);font-weight:400}
/* bottom bar */
.bar{height:96px;flex:none;background:var(--side);border-top:2px solid #111;display:flex;align-items:center;justify-content:center;gap:28px;padding:0 20px}
.sel{background:var(--panel);border:2px solid #111;color:var(--text);padding:8px 12px;min-width:180px;font:inherit;font-size:13px}
.sel small{display:block;color:var(--dim);font-size:11px}
.play{
  min-width:260px;height:60px;border:0;cursor:pointer;color:#fff;font-size:26px;
  background:var(--green);
  box-shadow:inset 3px 3px 0 var(--green-hi),inset -3px -3px 0 var(--green-lo),0 0 0 3px #111;
  text-shadow:2px 2px 0 #1a3b10;
}
.play:hover{background:#469b2e}
.play:active{box-shadow:inset 3px 3px 0 var(--green-lo),inset -3px -3px 0 var(--green-hi),0 0 0 3px #111}
.play small{display:block;font-size:10px;font-family:Inter,sans-serif;letter-spacing:0;text-shadow:none;color:#cfe8c5;margin-top:2px}
.play:disabled{filter:grayscale(.8);cursor:wait}
/* progress */
.prog{display:none;position:absolute;left:0;right:0;bottom:0;height:6px;background:#111}
.prog i{display:block;height:100%;width:0;background:var(--green-hi);transition:width .15s linear}
.bar{position:relative}
.bar.busy .prog{display:block}
/* game view */
#game{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10}
#game.on{display:flex}
#game .gb{height:40px;background:var(--side);border-bottom:2px solid #111;display:flex;align-items:center;gap:12px;padding:0 12px;flex:none}
#game .gb span{color:var(--dim);margin-right:auto}
.sm{background:var(--panel);border:2px solid #111;color:var(--text);padding:4px 12px;cursor:pointer;font:inherit;font-size:12px}
.sm:hover{background:#3d3e3f}
.sm.red{background:#8b2b22}
iframe{flex:1;border:0;width:100%;background:#fff}
.empty{padding:30px 18px;color:var(--dim);font-size:13px}
@media(max-width:720px){
  .side{width:84px}.item div+div,.side h3{display:none}.item{padding:8px 24px}
  .hero-in{padding:0 20px 20px}.hero-in h1{font-size:30px}.news{padding:0 20px 16px}
  .bar{gap:10px;padding:0 10px}.sel{display:none}.play{min-width:0;flex:1;font-size:20px}
  .tab{padding:0 8px}.user span{display:none}
}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>

<header class="top">
  <div class="logo pix"><div class="cube"></div><span id="siteName">MC (Eaglercraft)</span></div>
  <nav class="tabs pix" id="tabs"></nav>
  <div class="user"><span id="userName">Player</span><div class="head"></div></div>
</header>

<div class="main">
  <aside class="side" id="side"></aside>
  <section class="hero">
    <div class="sky" id="sky"></div>
    <div class="hero-in">
      <h1 class="pix" id="title"></h1>
      <p id="desc"></p>
      <div class="tags" id="tags"></div>
    </div>
    <div class="news" id="news"></div>
  </section>
</div>

<footer class="bar" id="bar">
  <div class="sel"><small>Launch mode</small><select id="mode" style="all:unset;cursor:pointer;width:100%">
    <option value="embed">Inside launcher</option><option value="tab">New tab</option></select></div>
  <button class="play pix" id="play">PLAY<small id="playSub"></small></button>
  <div class="sel"><small>Installation</small><span id="ver"></span></div>
  <div class="prog"><i id="progBar"></i></div>
</footer>

<div id="game">
  <div class="gb pix"><span id="gameName"></span>
    <button class="sm" id="reload">Reload</button>
    <button class="sm" id="popout">Open in tab</button>
    <button class="sm red" id="quit">Quit game</button></div>
  <iframe id="frame" title="Game" allow="fullscreen; gamepad; autoplay; clipboard-write" allowfullscreen></iframe>
</div>

<script>
/* ============ CONFIG ============
   Add your HTML files here. `file` is a path relative to this page.
   Optional: set REPO to auto-add every .html file in a repo folder
   via the GitHub API (public repos only), e.g. { user:"you", repo:"you.github.io", dir:"games" } */
const CONFIG = {
  siteName: "Minecraft (Eaglercraft) Launcher",
  userName: "LadiesMan217",
  REPO: null,
  games: [
    { id:"26-2",   name:"Minecraft 26.2",   file:"26.2.html",   icon:"⛏️", type:"Version", version:"26.2",   color:"#3c8527",
      desc:"The newest build." },
    { id:"1-12-2", name:"Minecraft 1.12.2", file:"1.12.2.html", icon:"⛏️", type:"Version", version:"1.12.2", color:"#4f7bc3",
      desc:"The classic modding-era release." },
    { id:"1-8-8",  name:"Minecraft 1.8.8",  file:"1.8.8.html",  icon:"⛏️", type:"Version", version:"1.8.8",  color:"#c3774f",
      desc:"The combat-update favorite." }
  ]
};
/* ================================ */

const $=id=>document.getElementById(id);
const store={get(k,d){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let games=[...CONFIG.games], sel=null, tab="Installations";
const TABS=["Play","Installations","News"];

$("siteName").textContent=CONFIG.siteName; $("userName").textContent=CONFIG.userName;

function art(g){
  const c=g.color||"#3c8527";
  return `linear-gradient(180deg,${c} 0%,${c}cc 50%,#2b2b2c 50% 56%,#5b3d27 56%)`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function renderTabs(){
  $("tabs").innerHTML=TABS.map(t=>`<button class="tab ${t===tab?"on":""}" data-t="${t}">${t.toUpperCase()}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderTabs();renderSide();renderNews()});
}
function renderSide(){
  const list=tab==="Installations"?games:games.filter(g=>g.type==="Game"||tab!=="Play"||true);
  const groups={};list.forEach(g=>(groups[g.type||"Other"]??=[]).push(g));
  $("side").innerHTML=Object.entries(groups).map(([k,arr])=>
    `<h3>${esc(k)}s</h3>`+arr.map(g=>`<div class="item ${sel&&sel.id===g.id?"on":""}" tabindex="0" data-id="${g.id}">
      <div class="icon" style="background:${g.color||"#3c8527"}">${g.icon||"🟩"}</div>
      <div><b>${esc(g.name)}</b><small>${esc(g.file)}</small></div></div>`).join("")
  ).join("")||`<div class="empty">No HTML files found. Add some to CONFIG.games.</div>`;
  $("side").querySelectorAll(".item").forEach(el=>{
    el.onclick=()=>select(el.dataset.id);
    el.onkeydown=e=>{if(e.key==="Enter")select(el.dataset.id)};
  });
}
function renderNews(){
  const order=[...games].sort((a,b)=>(+store.get("last:"+b.id,0))-(+store.get("last:"+a.id,0)));
  $("news").innerHTML=(tab==="News"?games:order).map(g=>{
    const t=+store.get("last:"+g.id,0);
    return `<div class="card" tabindex="0" data-id="${g.id}"><div class="th" style="background:${g.color||"#3c8527"}">${g.icon||"🟩"}</div>
    <div>${esc(g.name)}<small>${t?"Last played "+new Date(t).toLocaleDateString():"Never played"}</small></div></div>`}).join("");
  $("news").querySelectorAll(".card").forEach(el=>{el.onclick=()=>select(el.dataset.id);el.onkeydown=e=>{if(e.key==="Enter")select(el.dataset.id)}});
}
function select(id){
  sel=games.find(g=>g.id===id)||games[0]; if(!sel)return;
  store.set("sel",sel.id);
  $("sky").style.setProperty("--art",art(sel));
  $("title").textContent=sel.name.toUpperCase();
  $("desc").textContent=sel.desc||"";
  $("tags").innerHTML=[sel.type,"v"+(sel.version||"1.0"),sel.file].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  $("ver").textContent=(sel.name)+" "+(sel.version||"1.0");
  $("playSub").textContent=sel.name+" · "+(sel.version||"1.0");
  renderSide();
}

/* launching */
let launching=false;
function launch(){
  if(!sel||launching)return;
  launching=true; $("play").disabled=true; $("bar").classList.add("busy");
  const steps=["Downloading","Verifying","Starting"]; let p=0;
  const t=setInterval(()=>{
    p+=8+Math.random()*14; $("progBar").style.width=Math.min(p,100)+"%";
    $("playSub").textContent=steps[Math.min(2,Math.floor(p/34))]+" "+sel.name+"…";
    if(p>=100){clearInterval(t);finish()}
  },110);
}
function finish(){
  store.set("last:"+sel.id,Date.now());
  launching=false; $("play").disabled=false; $("bar").classList.remove("busy"); $("progBar").style.width="0";
  $("playSub").textContent=sel.name+" · "+(sel.version||"1.0");
  renderNews();
  if($("mode").value==="tab"){window.open(sel.file,"_blank","noopener");return}
  $("gameName").textContent=sel.name.toUpperCase();
  $("frame").src=sel.file; $("game").classList.add("on");
}
function quit(){$("game").classList.remove("on");$("frame").src="about:blank"}
$("play").onclick=launch; $("quit").onclick=quit;
$("reload").onclick=()=>{$("frame").src=sel.file};
$("popout").onclick=()=>{window.open(sel.file,"_blank","noopener");quit()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("game").classList.contains("on"))quit()});
$("mode").value=store.get("mode","embed"); $("mode").onchange=()=>store.set("mode",$("mode").value);

/* optional GitHub auto-discovery */
async function discover(){
  const R=CONFIG.REPO; if(!R)return;
  try{
    const r=await fetch(`https://api.github.com/repos/${R.user}/${R.repo}/contents/${R.dir||""}`);
    const files=(await r.json()).filter(f=>f.name.endsWith(".html")&&f.name!=="index.html");
    files.forEach(f=>{
      if(games.some(g=>g.file.endsWith(f.name)))return;
      const n=f.name.replace(/\.html$/,"");
      games.push({id:n.toLowerCase(),name:n.replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase()),
        file:(R.dir?R.dir+"/":"")+f.name,icon:"🟩",type:"Version",version:"1.0",color:"#3c8527",desc:"Discovered automatically."});
    });
  }catch(e){console.warn("Auto-discovery failed",e)}
}

(async()=>{
  await discover();
  renderTabs(); renderNews();
  select(store.get("sel",games[0]&&games[0].id));
  renderNews();
})();
</script>
</body>
</html>
